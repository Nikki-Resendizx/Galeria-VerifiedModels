<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin - Verified Models</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyAIHevrpglvhHK3IsxpnkHlWpxnuf5o1So",
  authDomain: "galeria-verifiedmodels.firebaseapp.com",
  projectId: "galeria-verifiedmodels",
  storageBucket: "galeria-verifiedmodels.firebasestorage.app",
  messagingSenderId: "684551560793",
  appId: "1:684551560793:web:3730a07d8d6ec737e3db48"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
window.db=db; window.storage=storage; window.collection=collection; window.doc=doc;
window.addDoc=addDoc; window.updateDoc=updateDoc; window.deleteDoc=deleteDoc;
window.onSnapshot=onSnapshot; window.serverTimestamp=serverTimestamp;
window.ref=ref; window.uploadBytes=uploadBytes; window.getDownloadURL=getDownloadURL; window.getDocs=getDocs;
</script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:12px}
#login{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#111;border:2px solid #ff69b4;border-radius:20px;padding:20px;width:100%;max-width:320px;text-align:center;box-shadow:0 0 30px #ff69b4}
.login-box input{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:10px 0;box-sizing:border-box}
h1{color:#ff69b4;text-align:center;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:center}
.top a{color:#fff;text-decoration:none;border:1px solid #ff69b4;padding:6px 12px;border-radius:20px;font-size:12px}
.form{background:#111;border:1px solid #ff69b4;border-radius:16px;padding:12px;margin:12px 0}
input, textarea{width:100%;background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;margin:6px 0;box-sizing:border-box;font-size:13px}
.row{display:flex;gap:8px}.row>div{flex:1}
label{font-size:11px;color:#ff8ec3;font-weight:bold;display:block;margin-top:8px;text-align:left}
.btn{width:100%;padding:14px;background:#ff69b4;color:#000;border:none;border-radius:25px;font-weight:bold;margin-top:10px;cursor:pointer}
.ref-wrap{margin-top:12px;border:1px dashed #ff69b4;border-radius:14px;padding:10px;background:#0a0a0a}
.ref-title{color:#ff8ec3;font-size:12px;font-weight:bold;margin-bottom:8px;text-align:left}
.ref-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ref-box{border:1px solid #333;border-radius:12px;overflow:hidden;background:#000;position:relative;height:110px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ref-box img{width:100%;height:100%;object-fit:cover}
.ref-box span{font-size:10px;color:#777;text-align:center;padding:4px}
.ref-box input{display:none}
.ref-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.7);color:#fff;border:none;width:20px;height:20px;border-radius:50%;font-size:12px;cursor:pointer}
.lista{display:grid;gap:8px;margin-top:12px}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:8px;display:flex;gap:10px;align-items:center}
.card img{width:60px;height:60px;border-radius:10px;object-fit:cover}
.btn-sec{padding:6px 10px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;font-size:11px;cursor:pointer}
.progress{font-size:10px;color:#00ff88;margin-top:4px;text-align:left}
#modalComent{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:100;display:none;overflow-y:auto;padding:12px}
.coment-admin{background:#111;border:1px solid #333;border-radius:10px;padding:8px;margin:6px 0;text-align:left;font-size:12px}
.coment-admin b{color:#ff8ec3}
</style>
</head>
<body>
<div id="login">
  <div class="login-box">
    <h2 style="color:#ff69b4">🔐 PANEL PRIVADO</h2>
    <p style="font-size:11px;color:#aaa">Contraseña: Nikki0112</p>
    <input type="password" id="passInput" placeholder="Escribe tu contraseña...">
    <button class="btn" onclick="checkPass()">Entrar</button>
    <p id="loginErr" style="color:#ff2d2d;font-size:11px;display:none">❌ Contraseña incorrecta</p>
  </div>
</div>
<div class="top"><a href="index.html">⬅ Galería</a><h1>🔐 ADMIN V3</h1><span id="contador" style="font-size:10px;color:#555">0</span></div>
<div class="form">
  <input type="hidden" id="editId">
  <div class="row"><div><label>Perfil</label><input id="perfil"></div><div><label>@ Username</label><input id="username"></div></div>
  <div class="row"><div><label>Edad</label><input id="edad" type="number"></div><div><label>Nacionalidad</label><input id="nacionalidad"></div></div>
  <label>Canal Free</label><input id="canal_free">
  <label>Descripción</label><textarea id="descripcion" rows="2"></textarea>
  <label>Servicios (coma)</label><input id="servicios" placeholder="Beso, Oral, Anal">
  <label>📸 Foto principal</label><input id="foto" placeholder="https://..."><input type="file" id="fileFoto" accept="image/*" style="border:1px dashed #ff69b4"><div id="progFoto" class="progress"></div>
  <div class="ref-wrap">
    <div class="ref-title">📸 Fotos de referencias (opcional)</div>
    <div class="ref-grid">
      <div class="ref-box" onclick="document.getElementById('fileRef1').click()"><span id="ref1Ph">+ Ref 1<br>📷</span><img id="ref1Img" style="display:none"><button class="ref-del" id="ref1Del" style="display:none" onclick="event.stopPropagation(); quitarRef(1)">✕</button><input type="file" id="fileRef1" accept="image/*" onchange="subirRef(this,1)"></div>
      <div class="ref-box" onclick="document.getElementById('fileRef2').click()"><span id="ref2Ph">+ Ref 2<br>📷</span><img id="ref2Img" style="display:none"><button class="ref-del" id="ref2Del" style="display:none" onclick="event.stopPropagation(); quitarRef(2)">✕</button><input type="file" id="fileRef2" accept="image/*" onchange="subirRef(this,2)"></div>
      <div class="ref-box" onclick="document.getElementById('fileRef3').click()"><span id="ref3Ph">+ Ref 3<br>📷</span><img id="ref3Img" style="display:none"><button class="ref-del" id="ref3Del" style="display:none" onclick="event.stopPropagation(); quitarRef(3)">✕</button><input type="file" id="fileRef3" accept="image/*" onchange="subirRef(this,3)"></div>
    </div>
    <div id="progRefs" class="progress"></div><input type="hidden" id="foto2"><input type="hidden" id="foto3"><input type="hidden" id="foto4">
  </div>
  <button class="btn" id="btnGuardar" onclick="guardar()">💾 Guardar Modelo</button>
  <button class="btn" style="background:#222;color:#fff;border:1px solid #333" onclick="limpiar()">🧹 Limpiar</button>
</div>
<input id="buscAdmin" placeholder="🔍 Buscar..." oninput="render()" style="margin-bottom:10px"><div id="lista" class="lista"></div>
<div id="modalComent" onclick="if(event.target==this) this.style.display='none'"><div style="max-width:420px;margin:20px auto;background:#111;border:2px solid #ff69b4;border-radius:16px;padding:12px"><h3 style="color:#ff8ec3">💬 Comentarios - <span id="comentModelo"></span></h3><div id="listaComentAdmin" style="max-height:60vh;overflow-y:auto"></div><button class="btn" style="background:#222;color:#fff" onclick="document.getElementById('modalComent').style.display='none'">Cerrar</button></div></div>
<script type="module">
const ADMIN_PASS = "Nikki0112";
window.checkPass=()=>{ let p=document.getElementById('passInput').value; if(p===ADMIN_PASS){ document.getElementById('login').style.display='none'; localStorage.setItem('adminAuth','ok'); }else{ document.getElementById('loginErr').style.display='block'; } }
if(localStorage.getItem('adminAuth')==='ok'){ document.getElementById('login').style.display='none'; }
let modelos=[];
window.subirRef = async(input, num)=>{
  let file=input.files[0]; if(!file) return; let prog=document.getElementById('progRefs'); prog.innerText=`⏳ Subiendo ref ${num}...`;
  try{ let name=`refs/${Date.now()}_${num}_${file.name.replace(/[^a-z0-9.]/gi,'_')}`; let storageRef=ref(storage, name); await uploadBytes(storageRef, file); let url=await getDownloadURL(storageRef); document.getElementById(`foto${num===1?2:num===2?3:4}`).value=url; document.getElementById(`ref${num}Img`).src=url; document.getElementById(`ref${num}Img`).style.display='block'; document.getElementById(`ref${num}Ph`).style.display='none'; document.getElementById(`ref${num}Del`).style.display='block'; prog.innerText=`✅ Ref ${num} subida`; }catch(e){ prog.innerText='❌ '+e.message; }
}
window.quitarRef=(num)=>{ document.getElementById(`foto${num===1?2:num===2?3:4}`).value=''; document.getElementById(`ref${num}Img`).style.display='none'; document.getElementById(`ref${num}Ph`).style.display='block'; document.getElementById(`ref${num}Del`).style.display='none'; }
document.getElementById('fileFoto').addEventListener('change', async(e)=>{ let file=e.target.files[0]; if(!file) return; let prog=document.getElementById('progFoto'); prog.innerText='⏳ Subiendo...'; try{ let name=`principales/${Date.now()}_${file.name.replace(/[^a-z0-9.]/gi,'_')}`; let sRef=ref(storage, name); await uploadBytes(sRef, file); let url=await getDownloadURL(sRef); document.getElementById('foto').value=url; prog.innerText='✅ Subida'; }catch(err){ prog.innerText='❌ '+err.message; } });
function render(){ let q=document.getElementById('buscAdmin').value.toLowerCase(); let lista=modelos.filter(m=>!q || `${m.perfil} ${m.username}`.toLowerCase().includes(q)); document.getElementById('contador').innerText=lista.length+' modelos'; document.getElementById('lista').innerHTML=lista.map(m=>`<div class="card"><img src="${m.foto}"><div style="flex:1;text-align:left"><b>${m.perfil} @${m.username}</b><br><span style="font-size:10px;color:#aaa">${m.edad}A • ${m.nacionalidad}</span></div><button class="btn-sec" onclick="editar('${m.id}')">✏️</button><button class="btn-sec" onclick="verComent('${m.id}','${m.perfil}')">💬</button><button class="btn-sec" style="color:#ff2d2d" onclick="borrar('${m.id}')">🗑️</button></div>`).join(''); }
window.render=render;
window.editar=(id)=>{ let m=modelos.find(x=>x.id===id); if(!m) return; document.getElementById('editId').value=m.id; ['perfil','username','edad','nacionalidad','canal_free','descripcion'].forEach(k=> document.getElementById(k).value=m[k]||''); document.getElementById('servicios').value=(m.servicios||[]).join(', '); document.getElementById('foto').value=m.foto||''; document.getElementById('foto2').value=m.foto2||''; document.getElementById('foto3').value=m.foto3||''; document.getElementById('foto4').value=m.foto4||''; [1,2,3].forEach(num=>{ let key=num===1?'foto2':num===2?'foto3':'foto4'; let url=m[key]||''; if(url){ document.getElementById(`ref${num}Img`).src=url; document.getElementById(`ref${num}Img`).style.display='block'; document.getElementById(`ref${num}Ph`).style.display='none'; document.getElementById(`ref${num}Del`).style.display='block'; }else quitarRef(num); }); window.scrollTo({top:0,behavior:'smooth'}); }
window.limpiar=()=>{ document.getElementById('editId').value=''; ['perfil','username','edad','nacionalidad','canal_free','descripcion','servicios','foto','foto2','foto3','foto4'].forEach(id=> document.getElementById(id).value=''); [1,2,3].forEach(n=> quitarRef(n)); }
window.guardar=async()=>{ let id=document.getElementById('editId').value; let data={ perfil: document.getElementById('perfil').value.trim(), username: document.getElementById('username').value.trim().replace('@',''), edad: document.getElementById('edad').value.trim(), nacionalidad: document.getElementById('nacionalidad').value.trim(), canal_free: document.getElementById('canal_free').value.trim(), descripcion: document.getElementById('descripcion').value.trim(), servicios: document.getElementById('servicios').value.split(',').map(s=>s.trim()).filter(Boolean), foto: document.getElementById('foto').value.trim(), foto2: document.getElementById('foto2').value.trim(), foto3: document.getElementById('foto3').value.trim(), foto4: document.getElementById('foto4').value.trim(), updatedAt: serverTimestamp() }; if(!data.perfil ||!data.foto) return alert('Falta nombre y foto'); document.getElementById('btnGuardar').disabled=true; try{ if(id){ await updateDoc(doc(db,"modelos",id), data); alert('✅ Actualizada'); }else{ data.votosBueno=0; data.votosMalo=0; data.createdAt=serverTimestamp(); await addDoc(collection(db,"modelos"), data); alert('✅ Creada'); limpiar(); } }catch(e){ alert(e.message); } document.getElementById('btnGuardar').disabled=false; }
window.borrar=async(id)=>{ if(!confirm('¿Borrar?')) return; await deleteDoc(doc(db,"modelos",id)); }
window.verComent=async(id, nombre)=>{ document.getElementById('comentModelo').innerText=nombre; document.getElementById('modalComent').style.display='block'; let snap=await getDocs(collection(db,"modelos",id,"comentarios")); let html=''; snap.forEach(d=>{ let c=d.data(); html+=`<div class="coment-admin"><b>👤 ${c.tg_username} (ID: ${c.tg_id})</b><br><span>${c.texto}</span><br><small style="color:#666">${c.fecha?.seconds?new Date(c.fecha.seconds*1000).toLocaleString():''}</small><br><button class="btn-sec" style="color:#ff2d2d;margin-top:4px" onclick="borrarComent('${id}','${d.id}')">🗑️ Borrar este comentario</button></div>`; }); document.getElementById('listaComentAdmin').innerHTML= html || 'Sin comentarios'; }
window.borrarComent=async(modeloId, comentId)=>{ if(!confirm('¿Borrar este comentario?')) return; await deleteDoc(doc(db,"modelos",modeloId,"comentarios",comentId)); alert('🗑️ Borrado'); document.getElementById('modalComent').style.display='none'; }
onSnapshot(collection(db,"modelos"), snap=>{ modelos=[]; snap.forEach(d=> modelos.push({id:d.id,...d.data()})); render(); });
</script>
</body>
</html>
