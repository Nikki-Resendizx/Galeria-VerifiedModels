<style>

@keyframes pop{0%{transform:scale(0.85);opacity:0}100%{transform:scale(1);opacity:1}}

.btn-contact{background:#000;color:#fff;width:100%;margin-top:8px;padding:14px 10px;border:2px solid #2AABEE;border-radius:30px;font-weight:bold;display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;box-sizing:border-box}
.btn-sec{flex:1;background:#111;border:1px solid #333;color:#fff;padding:10px;border-radius:20px;font-size:12px;cursor:pointer}
.coment-box{margin-top:14px;text-align:left;background:#0a0a0a;border-radius:16px;padding:10px;border:1px solid #222}

<script type="module">
let modeloActual=null, modelosDB=[], filtroServicio=null, currentSlide=0;
const BOT_LINK = "https://t.me/galeriaVerifiedModels_Bot/Galeria";
if(!localStorage.getItem('miAnonId')){ let tg=window.Telegram?.WebApp?.initDataUnsafe?.user; localStorage.setItem('miAnonId', tg?.id || 'anon_'+Math.random().toString(36).slice(2,7)); }
function getFotos(m){ let arr=[m.foto]; if(m.foto2) arr.push(m.foto2); if(m.foto3) arr.push(m.foto3); if(m.foto4) arr.push(m.foto4); if(m.fotos && Array.isArray(m.fotos)) arr = arr.concat(m.fotos); return [...new Set(arr)].filter(Boolean).slice(0,5); }
function yaVoto(id){ let v=JSON.parse(localStorage.getItem('votos')||'{}'); return!!v[id]; }
function marcarVoto(id){ let v=JSON.parse(localStorage.getItem('votos')||'{}'); v[id]=true; localStorage.setItem('votos', JSON.stringify(v)); }
function render(lista){
  document.getElementById('contador').innerText=`💖 ${lista.length} modelos`;
  const gal=document.getElementById('galeria');
  if(!lista.length){ gal.innerHTML='<p style="color:silver;grid-column:span 2">Sin resultados 🩷</p>'; return; }
  gal.innerHTML=lista.map(m=>{
    let malo=m.votosMalo||0, bueno=m.votosBueno||0, total=malo+bueno, pBueno=total?Math.round(bueno/total*100):0;
    let ver= total>=5 && pBueno>=80;
    return `<div class="mini ${ver?'verified':''}" onclick="abrir('${m.id}')">
      ${ver?'<span class="badge-verified">✅ VERIFIED</span>':''}
      <img src="${m.foto}" loading="lazy" onerror="this.src='Logo.webp'">
      <div class="mini-nombre"><b>${m.perfil}</b><span>${total?`👍🏻 ${pBueno}% • ${total} votos`:`${m.nacionalidad} • ${m.edad}A`}</span></div>
    </div>`;
  }).join('');
  renderTop3();
}
function renderTop3(){
  let top=[...modelosDB].sort((a,b)=> (b.votosBueno||0) - (a.votosBueno||0)).slice(0,3);
  document.getElementById('top3').innerHTML=top.map(m=>`<div class="top3-card" onclick="abrir('${m.id}')"><img src="${m.foto}"><b>🥇 ${m.perfil}</b><span style="font-size:9px;color:#00ff88">${m.votosBueno||0} 👍🏻</span></div>`).join('');
}
function buildChips(){
  let all=new Set(); modelosDB.forEach(m=> (m.servicios||[]).forEach(s=>all.add(s)));
  let html=`<span class="chip ${!filtroServicio?'active':''}" onclick="setChip(null)">Todas</span>`;
  all.forEach(s=> html+=`<span class="chip ${filtroServicio===s?'active':''}" onclick="setChip('${s.replace(/'/g,'')}')">${s}</span>`);
  document.getElementById('chips').innerHTML=html;
}
window.setChip=(s)=>{ filtroServicio=s; filtrar(); buildChips(); }
window.filtrar=()=>{
  let q=document.getElementById('buscador').value.toLowerCase();
  let orden=document.getElementById('orden').value;
  let favs=JSON.parse(localStorage.getItem('favs')||'[]');
  let lista=[...modelosDB];
  if(q) lista=lista.filter(m=> `${m.perfil} ${m.username} ${m.nacionalidad}`.toLowerCase().includes(q));
  if(filtroServicio) lista=lista.filter(m=> (m.servicios||[]).includes(filtroServicio));
  if(orden==='fav') lista=lista.filter(m=> favs.includes(m.id));
  if(orden==='top') lista.sort((a,b)=> ((b.votosBueno||0)/((b.votosBueno||0)+(b.votosMalo||0)||1)) - ((a.votosBueno||0)/((a.votosBueno||0)+(a.votosMalo||0)||1)));
  if(orden==='nuevo') lista.sort((a,b)=> (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  render(lista);
}
let comentariosUnsub=null;
window.abrir=(id)=>{
  let m=modelosDB.find(x=>x.id===id); if(!m) return; modeloActual=m; currentSlide=0;
  let fotos=getFotos(m);
  document.getElementById('track').innerHTML=fotos.map(f=>`<img src="${f}" onerror="this.src='Logo.webp'">`).join('');
  document.getElementById('track').style.transform='translateX(0)';
  document.getElementById('dots').innerHTML=fotos.map((_,i)=>`<div class="dot ${i===0?'active':''}"></div>`).join('');
  let startX=0; const car=document.getElementById('carousel');
  car.ontouchstart=e=> startX=e.touches[0].clientX;
  car.ontouchend=e=>{ let dx=e.changedTouches[0].clientX-startX; if(dx<-50 && currentSlide<fotos.length-1) goSlide(currentSlide+1); if(dx>50 && currentSlide>0) goSlide(currentSlide-1); };
  document.getElementById('mNombre').innerText=m.perfil;
  document.getElementById('mUser').innerText='@'+m.username;
  document.getElementById('mInfo').innerText=`${m.nacionalidad} • ${m.edad} años`;
  document.getElementById('mServs').innerHTML=(m.servicios||[]).map(s=>`<span class="tag">${s}</span>`).join('') || '<span style="color:#555">Sin servicios</span>';
  document.getElementById('mDesc').innerText=`"${m.descripcion||''}"`;
  document.getElementById('mCanal').href=m.canal_free||'#';
  document.getElementById('mContacto').href=m.username?`https://t.me/${m.username.replace('@','')}`:'#';
  document.getElementById('mContacto').style.display=m.username?'flex':'none';
  let malo=m.votosMalo||0, bueno=m.votosBueno||0, total=malo+bueno, pBueno=total?Math.round(bueno/total*100):0;
  document.getElementById('mVerified').style.display=(total>=5 && pBueno>=80)?'block':'none';
  let bloqueo = yaVoto(m.id);
  document.getElementById('btnMalo').disabled = bloqueo;
  document.getElementById('btnBueno').disabled = bloqueo;
  document.getElementById('yaVotoMsg').style.display = bloqueo? 'block' : 'none';
  actualizar();
  cargarComentarios(m.id);
  document.getElementById('modal').style.display='block';
  document.body.style.overflow='hidden';
  history.pushState(null,'',`?m=${m.id}`);
}
function goSlide(n){
  let track=document.getElementById('track');
  currentSlide=n; track.style.transform=`translateX(-${n*100}%)`;
  document.querySelectorAll('.dot').forEach((d,i)=> d.classList.toggle('active', i===n));
}
window.cerrar=()=>{ document.getElementById('modal').style.display='none'; document.body.style.overflow='auto'; history.pushState(null,'',' '); if(comentariosUnsub) comentariosUnsub(); }
function actualizar(){
  if(!modeloActual) return; let m=modelosDB.find(x=>x.id===modeloActual.id)||modeloActual;
  modeloActual=m; let malo=m.votosMalo||0, bueno=m.votosBueno||0, total=malo+bueno;
  let pMalo=total?Math.round(malo/total*100):0, pBueno=total?Math.round(bueno/total*100):0;
  document.getElementById('mMaloTxt').innerText=`👎🏻 ${pMalo}% (${malo})`;
  document.getElementById('mBuenoTxt').innerText=`👍🏻 ${pBueno}% (${bueno})`;
  document.getElementById('barraMalo').style.width=pMalo+'%';
  document.getElementById('barraBueno').style.width=pBueno+'%';
}
window.votar=async(tipo)=>{
  if(!modeloActual) return;
  if(yaVoto(modeloActual.id)){ alert('😩 Ya votaste por esta modelo'); return; }
  const ref=doc(db,"modelos",modeloActual.id);
  try{
    if(tipo==='MALO') await updateDoc(ref,{votosMalo:increment(1)}); else await updateDoc(ref,{votosBueno:increment(1)});
    marcarVoto(modeloActual.id);
    document.getElementById('btnMalo').disabled=true; document.getElementById('btnBueno').disabled=true;
    document.getElementById('yaVotoMsg').style.display='block';
    let tg_id = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || localStorage.getItem('miAnonId');
    let username = window.Telegram?.WebApp?.initDataUnsafe?.user?.username? '@'+window.Telegram?.WebApp?.initDataUnsafe?.user?.username : `ID:${tg_id}`;
    let m = modelosDB.find(x=>x.id===modeloActual.id) || modeloActual;
    let total = (m.votosMalo||0)+(m.votosBueno||0)+1;
    fetch('/api/voto',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ tipo, modelo:{perfil:m.perfil, username:m.username}, username, tg_id, total }) });
  }catch(e){ alert('Error: '+e.message); }
}
window.compartir=()=>{
  if(!modeloActual) return;
  let botUrl = `${BOT_LINK}?startapp=m_${modeloActual.id}`;
  let texto = `👑 ${modeloActual.perfil} - @${modeloActual.username} 💖\nMira su perfil verificado aquí 👇\n${botUrl}`;
  if(navigator.share){ navigator.share({title:modeloActual.perfil, text:texto, url:botUrl}); }
  else { navigator.clipboard.writeText(botUrl); alert('🔗 Link del BOT copiado:\n'+botUrl); }
}
window.fav=()=>{
  let favs=JSON.parse(localStorage.getItem('favs')||'[]');
  if(!favs.includes(modeloActual.id)){ favs.push(modeloActual.id); localStorage.setItem('favs',JSON.stringify(favs)); alert('❤️ Guardada'); }
  else { localStorage.setItem('favs',JSON.stringify(favs.filter(x=>x!==modeloActual.id))); alert('💔 Quitó de favoritos'); }
}
function cargarComentarios(modeloId){
  const q=query(collection(db,"modelos",modeloId,"comentarios"), orderBy("fecha","desc"));
  comentariosUnsub=onSnapshot(q,(snap)=>{
    let miId = (window.Telegram?.WebApp?.initDataUnsafe?.user?.id || localStorage.getItem('miAnonId') || '').toString();
    let html=''; snap.forEach(d=>{
      let c=d.data();
      let esMio = c.tg_id?.toString() === miId;
      html+=`<div class="coment"><b>👤 Anónimo • ${new Date(c.fecha?.seconds*1000||Date.now()).toLocaleDateString()}</b><span>${c.texto}</span>${esMio?`<br><button onclick="borrarMiComent('${d.id}')" style="background:#222;color:#ff2d2d;border:1px solid #ff2d2d;border-radius:10px;font-size:10px;padding:3px 8px;margin-top:4px;cursor:pointer">🗑️ Borrar mi comentario</button>`:''}</div>`;
    });
    document.getElementById('listaComent').innerHTML= html || '<span style="color:#555;font-size:11px">Sé el primero en comentar 🩷</span>';
  });
}
window.borrarMiComent=async(comentId)=>{ if(!modeloActual) return; if(!confirm('¿Borrar tu comentario?')) return; await deleteDoc(doc(db,"modelos",modeloActual.id,"comentarios",comentId)); }
window.enviarComent=async()=>{
  let txt=document.getElementById('inputComent').value.trim(); if(!txt ||!modeloActual) return;
  let tg=window.Telegram?.WebApp?.initDataUnsafe?.user;
  let anonId = tg?.id || localStorage.getItem('miAnonId');
  let tgUser = tg?.username? '@'+tg.username : `ID:${anonId}`;
  let nombre = tg?.first_name || 'Anónimo';
  let last = tg?.last_name || '';
  let fullNombre = (nombre+' '+last).trim();
  await addDoc(collection(db,"modelos",modeloActual.id,"comentarios"),{ texto:txt, anonimo:true, tg_id: anonId, tg_username: tgUser, tg_nombre: fullNombre, fecha: serverTimestamp() });
  document.getElementById('inputComent').value='';
  // === AVISO AL CANAL PRIVADO ===
  try{
    fetch('/api/comentario',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        modelo: { perfil: modeloActual.perfil, username: modeloActual.username, id: modeloActual.id },
        usuario: { nombre: fullNombre, username: tgUser, id: anonId },
        comentario: txt
      })
    });
  }catch(e){}
}
onSnapshot(collection(db,"modelos"), (snap)=>{
  modelosDB=[]; snap.forEach(d=> modelosDB.push({id:d.id,...d.data()}));
  buildChips(); filtrar();
  const params=new URLSearchParams(location.search); let mid = params.get('m') || params.get('startapp');
  if(mid && mid.startsWith('m_')) mid = mid.replace('m_','');
  let tgStart = window.Telegram?.WebApp?.initDataUnsafe?.start_param;
  if(tgStart && tgStart.startsWith('m_')) mid = tgStart.replace('m_','');
  if(mid && document.getElementById('modal').style.display!=='block'){ let found=modelosDB.find(x=>x.id===mid); if(found) abrir(mid); }
  if(document.getElementById('modal').style.display==='block') actualizar();
});
</script>
